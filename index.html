<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Monumenti Roma</title>
    <link rel="stylesheet" href="style.css">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>

    <h1 id="titolo">MONUMENTI DI ROMA</h1>

    <div id="map" style="height: 500px;"></div>

    <a id="linkRoma" href="https://it.wikipedia.org/wiki/Roma" target="_blank">
        Scopri Roma su Wikipedia
    </a>
    <h2>Aggiungi Monumento</h2>

<form id="formMonumento">
    <input type="text" id="lat" placeholder="Latitudine" required>
    <input type="text" id="lng" placeholder="Longitudine" required>
    <button type="submit">Aggiungi</button>
</form>

<button onclick="mostraStatisticheMonumenti()">Mostra statistiche</button>

    <button id="btnTabella">Mostra tabella</button>

    <div id="tabellaContainer"></div>   

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script src="monumenti.js"></script>
<script src="script.js"></script>

</body>
</html>
